[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webcamcontrol"
version = "1.0.0"
description = "Desktop app to tune webcam image settings, save presets, and capture photos and videos."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Victor Abad Romero", email = "victorabadromero@gmail.com" }]
requires-python = ">=3.10"
keywords = ["webcam", "camera", "opencv", "customtkinter", "desktop-app", "gui"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video :: Capture",
]

dependencies = [
    "opencv-python>=4.8.0",
    "customtkinter>=5.2.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "ruff>=0.15.0",
]

[project.scripts]
webcamcontrol = "webcam_control:main"

[project.urls]
Repository = "https://github.com/VicProgram/WebcamControl"
Issues = "https://github.com/VicProgram/WebcamControl/issues"

[tool.hatch.build.targets.wheel]
only-include = ["webcam_control.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["webcam_control"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
